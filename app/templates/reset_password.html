{% extends "base.html" %}
{% block title %}Reset Password, Bytwise{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-lock"></i></div>
            <h1>Bytwise</h1>
            <p class="text-muted">Choose a new password for your account.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/reset-password" class="stacked-form" id="reset-password-form">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-field">
                <label>New Password</label>
                <input type="password" name="password" required minlength="6" placeholder="********">
                <p class="text-muted small">Minimum 6 characters</p>
            </div>

            <div class="form-field">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required minlength="6" placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
