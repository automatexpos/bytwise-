{# Reusable star rating display, mirrors the star rows used in ShopDetail.tsx and Profile.tsx reviews.
   Expected context: `rating` (float 0-5). #}
<span class="star-rating" aria-label="{{ rating }} out of 5 stars">
    {% for i in range(1, 6) %}
        {% if i <= (rating|round(0, 'floor')|int) %}
            <i class="fas fa-star star-filled"></i>
        {% else %}
            <i class="fas fa-star star-empty"></i>
        {% endif %}
    {% endfor %}
</span>
