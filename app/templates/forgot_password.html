{% extends "base.html" %}
{% block title %}Forgot Password, Bytwise{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fas fa-key"></i></div>
            <h1>Bytwise</h1>
            <p class="text-muted">Enter your account email and we'll send you a verification code.</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/auth/forgot-password" class="stacked-form" id="forgot-password-form">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-field">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="barista@example.com">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Send Code</button>
        </form>

        <p class="auth-footnote"><a href="/auth?mode=login&next={{ next|urlencode }}">Back to login</a></p>
    </div>
</div>
{% endblock %}
