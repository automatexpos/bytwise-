<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bytwise{% endblock %}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <span class="navbar-logo"><i class="fas fa-droplet"></i></span>
                <span class="navbar-wordmark">Bytwise</span>
            </a>
            <div class="navbar-actions">
                {% if user %}
                    {% if user.is_admin %}
                        <a href="/admin" class="navbar-link">Admin</a>
                    {% endif %}
                    <a href="/add" class="btn btn-outline btn-sm">
                        <i class="fas fa-plus"></i> <span class="hide-mobile">Add Spot</span>
                    </a>
                    <a href="/profile" class="navbar-avatar">
                        <img src="{{ user.avatar_url }}" alt="{{ user.username }}">
                    </a>
                {% else %}
                    <a href="/auth?next={{ request.url.path|urlencode }}" class="btn btn-primary btn-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div id="toast-container" class="toast-container"></div>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/static/js/app.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
